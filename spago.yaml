package:
  name: "node-event-emitter"
  dependencies:
    - effect
    - either
    - functions
    - maybe
    - nullable
    - prelude
    - unsafe-coerce
  test:
    main: "Test.Main"
    dependencies:
      - aff
      - spec
      - foldable-traversable
      - tuples
      - refs

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output, --threaded]
  packageSet:
    registry: 77.7.0
